$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  SecretProviderBinding:
    type: object
    additionalProperties: false
    required:
    - id
    - projectId
    - secretRequirementId
    - providerType
    - providerConfigRef
    - status
    - version
    properties:
      id:
        $ref: common.yaml#/$defs/Uuid
      projectId:
        $ref: common.yaml#/$defs/Uuid
      secretRequirementId:
        $ref: common.yaml#/$defs/Uuid
      providerType:
        enum:
        - user-input
        - target-existing
        - regenerate
        - vault
        - sops
        - out-of-band
        - cloud-secret-manager
        - envforge-managed-escrow
        - custom
      providerConfigRef:
        type: string
      status:
        enum:
        - unvalidated
        - valid
        - invalid
        - unavailable
      version:
        type: integer
  CreateSecretBindingRequest:
    type: object
    additionalProperties: false
    required:
    - secretRequirementId
    - providerType
    - providerConfigRef
    properties:
      secretRequirementId:
        $ref: common.yaml#/$defs/Uuid
      providerType:
        type: string
      providerConfigRef:
        type: string
      providerSecretRef:
        type: string
      rotationPolicy:
        type: string
  SecretGate:
    type: object
    additionalProperties: false
    required:
    - id
    - secretRequirementId
    - stage
    - state
    - blocking
    properties:
      id:
        $ref: common.yaml#/$defs/Uuid
      secretRequirementId:
        $ref: common.yaml#/$defs/Uuid
      stage:
        type: string
      state:
        enum:
        - pending
        - available
        - blocked
        - expired
      blocking:
        type: boolean
      explanation:
        type: string
  SecretInputSession:
    type: object
    additionalProperties: false
    required:
    - id
    - runId
    - requirementId
    - expiresAt
    - state
    properties:
      id:
        $ref: common.yaml#/$defs/Uuid
      runId:
        $ref: common.yaml#/$defs/Uuid
      requirementId:
        $ref: common.yaml#/$defs/Uuid
      expiresAt:
        type: string
        format: date-time
      state:
        enum:
        - waiting
        - submitted
        - consumed
        - expired
      oneTimeToken:
        type: string
        writeOnly: true
  SecretInputRequest:
    type: object
    additionalProperties: false
    required:
    - value
    properties:
      value:
        type: string
        writeOnly: true
