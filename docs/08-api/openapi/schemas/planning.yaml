$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  DecisionSetRevision:
    type: object
    additionalProperties: false
    required:
    - id
    - projectId
    - revision
    - content
    - contentHash
    properties:
      id:
        $ref: common.yaml#/$defs/Uuid
      projectId:
        $ref: common.yaml#/$defs/Uuid
      revision:
        type: integer
      content:
        type: object
      contentHash:
        $ref: common.yaml#/$defs/Hash
  CreateDecisionSetRequest:
    type: object
    additionalProperties: false
    required:
    - content
    properties:
      content:
        type: object
  PlanCompilationRequest:
    type: object
    additionalProperties: false
    required:
    - blueprintRevisionIds
    - decisionSetRevisionId
    properties:
      blueprintRevisionIds:
        type: array
        minItems: 1
        items:
          $ref: common.yaml#/$defs/Uuid
      decisionSetRevisionId:
        $ref: common.yaml#/$defs/Uuid
      sourceSnapshotId:
        type: string
        format: uuid
      targetSnapshotId:
        type: string
        format: uuid
      archiveVersionId:
        type: string
        format: uuid
  PlanCompilationRun:
    allOf:
    - $ref: common.yaml#/$defs/OperationBase
    - type: object
      properties:
        operationType:
          const: plan-compilation
        diagnostics:
          type: object
        phase:
          enum:
          - validating-inputs
          - resolving-graph
          - compiling-contracts
          - finalizing
        outcome:
          type:
          - string
          - 'null'
          enum:
          - compiled
          - review-required
          - blocked
          - null
      required:
      - operationType
      - phase
    unevaluatedProperties: false
  PlanRevision:
    type: object
    additionalProperties: false
    required:
    - id
    - projectId
    - revision
    - planType
    - status
    - inputBindings
    - planHash
    - version
    properties:
      id:
        $ref: common.yaml#/$defs/Uuid
      projectId:
        $ref: common.yaml#/$defs/Uuid
      revision:
        type: integer
      planType:
        enum:
        - build
        - migration
        - capture
        - restore
      status:
        enum:
        - compiled
        - review-required
        - approval-pending
        - approved
        - rejected
        - superseded
        - revoked
        - expired
        - archived
      inputBindings:
        type: array
        items:
          type: object
      planHash:
        $ref: common.yaml#/$defs/Hash
      version:
        type: integer
  PlanAction:
    type: object
    additionalProperties: false
    required:
    - id
    - actionKey
    - stageKey
    - actionType
    - adapterId
    - adapterVersion
    - implementationHash
    - inputs
    - resumability
    - riskLevel
    properties:
      id:
        $ref: common.yaml#/$defs/Uuid
      actionKey:
        type: string
      stageKey:
        type: string
      actionType:
        type: string
      adapterId:
        type: string
      adapterVersion:
        type: string
      resumability:
        enum:
        - idempotent
        - byte-resumable
        - step-resumable
        - restart-required
        - manual
      riskLevel:
        enum:
        - low
        - medium
        - high
        - critical
      implementationHash:
        $ref: common.yaml#/$defs/Hash
      inputs:
        type: object
      preconditions:
        type: array
        items:
          type: object
      postconditions:
        type: array
        items:
          type: object
      resourceKeys:
        type: array
        items:
          type: string
      verificationCheckIds:
        type: array
        items:
          type: string
      rollbackDefinition:
        type:
        - object
        - 'null'
  ApprovalRequest:
    type: object
    additionalProperties: false
    required:
    - acceptedRiskIds
    properties:
      acceptedRiskIds:
        type: array
        items:
          type: string
      comment:
        type: string
  PlanApproval:
    type: object
    additionalProperties: false
    required:
    - id
    - planRevisionId
    - approvedPlanHash
    - approvalHash
    - status
    - version
    properties:
      id:
        $ref: common.yaml#/$defs/Uuid
      planRevisionId:
        $ref: common.yaml#/$defs/Uuid
      approvedPlanHash:
        $ref: common.yaml#/$defs/Hash
      approvalHash:
        $ref: common.yaml#/$defs/Hash
      status:
        enum:
        - pending
        - approved
        - rejected
        - revoked
        - expired
      version:
        type: integer
