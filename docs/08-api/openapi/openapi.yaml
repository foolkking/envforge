openapi: 3.1.0
info:
  title: EnvForge API
  version: 1.1.0
  description: Normative design contract. Availability is additionally gated by implementation Phase and Capability certification.
servers:
- url: /api/v1
tags:
- name: Projects
- name: Discovery
- name: Review
- name: Workloads
- name: Planning
- name: Execution
- name: Dataset
- name: Secrets
- name: Cutover
- name: Archive
- name: Platform
paths:
  /projects:
    post:
      summary: Create project
      operationId: CreateProject
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/project.yaml#/$defs/CreateProjectRequest
      responses:
        '201':
          description: Created
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/project.yaml#/$defs/EnvironmentProject
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '412':
          $ref: '#/components/responses/E412'
        '422':
          $ref: '#/components/responses/E422'
    get:
      summary: List projects
      operationId: ListProjects
      tags:
      - Projects
      parameters:
      - &id001
        $ref: '#/components/parameters/Limit'
      - &id002
        $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ./schemas/project.yaml#/$defs/EnvironmentProject
                  page:
                    $ref: ./schemas/common.yaml#/$defs/PageMeta
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '412':
          $ref: '#/components/responses/E412'
        '422':
          $ref: '#/components/responses/E422'
  /projects/{projectId}:
    get:
      summary: Get project
      operationId: GetProject
      tags:
      - Projects
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
