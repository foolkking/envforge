        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/project.yaml#/$defs/UpdateProjectRequest
      responses:
        '200':
          description: Updated project envelope
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas/project.yaml#/$defs/EnvironmentProject
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
